<style>

.b-red{background:var(--red-bg); color:var(--red); border-color:var(--red-bd);}
.b-purple{background:var(--purple-bg); color:var(--purple); border-color:var(--purple-bd);}
.b-blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue-bd);}

/* ---------- print reports ---------- */
#print-area{display:none;}
@media print{
  @page{margin:0.6in;}
  html,body{background:#fff !important;}
  body{font-family:Georgia,'Times New Roman',serif; color:#000;}
  body>*:not(#print-area){display:none !important;}

  .pr-head{border-bottom:2.5px solid #000; padding-bottom:10px; margin-bottom:14px;}

  .pr-table{width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:9.5pt;}
  .pr-table th{background:#e8e8e8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;
    text-align:left; padding:6px 8px; border:1px solid #666; font-weight:800;}
  .pr-table td{padding:6px 8px; border:1px solid #666; vertical-align:top;}

  .pr-kv{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dotted #999; font-size:10.5pt; page-break-inside:avoid;}
  .pr-kv span{color:#333;}
  .pr-head,.pr-sec{page-break-after:avoid;}
}
</style>

function setModelField(str){
  const ms = document.getElementById("nt-model"); if(!ms || !str) return false;
  const want = String(str).trim().toLowerCase();
  for(const o of ms.options){ if(o.value && o.value !== "__other__" && o.value.toLowerCase() === want){ ms.value = o.value; modelTextToggle(); return true; } }

  const ms = document.getElementById("nt-model"); if(!ms) return "";

  return ms.value || "";
}
window.rebuildModelOptions = ()=>{
  const mk = document.getElementById("nt-make"), ms = document.getElementById("nt-model"); if(!mk || !ms) return;

};
window.modelTextToggle = ()=>{
  const ms = document.getElementById("nt-model"), tx = document.getElementById("nt-model-text");
  if(ms && tx) tx.style.display = (ms.value === "__other__") ? "block" : "none";
};

const SB_APP = 'parking-tickets';

var sbDirty = false; // true after a local save until its cloud push succeeds
function sbBadge(online, syncing){
  var el = document.getElementById('sb-sync-badge');
  if(!el){
    el = document.createElement('div');
    el.id = 'sb-sync-badge';
    el.style.cssText = 'position:fixed;bottom:10px;right:10px;z-index:9999;font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,0.65);color:#fff;pointer-events:none;font-family:system-ui,sans-serif;';
    document.body.appendChild(el);
  }
  el.textContent = syncing ? '\u27F3 Syncing\u2026' : (online ? '\u25CF Live sync' : '\u25CB Offline');
  el.style.color = syncing ? '#fbbf24' : (online ? '#4ade80' : '#f87171');
}
function tktCount(d){ d = d || {}; return (d.tickets ? d.tickets.length : 0); }
function normState(){
  if(!Array.isArray(S.tickets)) S.tickets = [];
  if(!Array.isArray(S.team) || !S.team.length) S.team = DEFAULT_TEAM.slice();
  if(!Array.isArray(S.logins)) S.logins = [];
  if(!S.seq) S.seq = 1;
  if(!S.seqDay) S.seqDay = "";
}
async function sbPush(){
  sbBadge(true, true);
  if(!S._ts){ S._ts = Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  try{
    /* Merge-guard: never let a stale copy shrink the shared list. */
    try{
      var chk = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + encodeURIComponent(SB_ROW_ID) + '&select=data', { headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY} });
      if(chk.ok){
        var crows = await chk.json();
        if(crows && crows.length){
          var cloudTkts = (crows[0].data && crows[0].data.tickets) || [];
          if(cloudTkts.length > S.tickets.length + 5){
            var have = {}; S.tickets.forEach(function(x){ have[x.uid] = 1; });
            cloudTkts.forEach(function(x){ if(!have[x.uid]) S.tickets.push(x); });
            try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
          }
        }
      }
    }catch(e){}
    var payload = JSON.parse(JSON.stringify(S));
    if('session' in payload) payload.session = null;
    var res = await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify({id: SB_ROW_ID, app: SB_APP, data: payload})
    });
    if(res.ok){ sbDirty = false; sbBadge(true, false); } else sbBadge(false, false);
  }catch(e){ sbBadge(false, false); }
}
async function sbPull(){
  try{
    var res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + encodeURIComponent(SB_ROW_ID) + '&select=data', {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
    });
    if(!res.ok) return;
    var rows = await res.json();
    if(!rows || !rows.length){ if(tktCount(S) > 0) sbPush(); return; }
    var cloud = rows[0].data || {};
    if(sbDirty){ sbPush(); return; }
    var cloudTs = cloud._ts || 0, localTs = S._ts || 0;
    var takeCloud = function(){
      var keepSession = S.session;
      S = cloud;
      normState();
      S.session = keepSession;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      /* Never wipe a half-filled New Ticket form on a background pull. */
      if(!(tab === "new" && newFormHasContent()) && typeof render === 'function'){ try{ render(); }catch(e){} }
      sbBadge(true, false);
    };
    if(cloudTs === 0 && localTs === 0){
      if(tktCount(S) >= tktCount(cloud)){
        if(tktCount(S) > 0 || tktCount(cloud) > 0) sbPush(); else sbBadge(true, false);
        return;
      }
      takeCloud(); sbPush(); return;
    }
    if(cloudTs > localTs){
      if(tktCount(cloud) === 0 && tktCount(S) > 0){ sbPush(); return; }
      if(localTs === 0 && tktCount(S) > tktCount(cloud)){ sbPush(); return; }
      takeCloud(); return;
    }
    if(localTs > cloudTs){ sbPush(); return; }
    sbBadge(true, false);
  }catch(e){}
}
function sbSchedulePush(){
  if(sbSyncTimer) clearTimeout(sbSyncTimer);
  sbSyncTimer = setTimeout(sbPush, 2000);
}
setTimeout(sbPull, 2000);
setInterval(sbPull, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) sbPull(); });

function uid(p){ return p + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLocal(){ const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function fmtDT(s){ if(!s) return "—"; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString(); }
function fmtD(s){ if(!s) return "—"; const d=new Date(s+"T12:00:00"); return isNaN(d)?esc(s):d.toLocaleDateString(); }
function dayStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()); }
function nextTicketNum(){
  const d = dayStamp();
  if(S.seqDay !== d){ S.seqDay = d; S.seq = 1; }
  const n = S.seq++;
  return "TKT-" + PROP_CODE + "-" + d + "-" + String(n).padStart(4,"0");
}

  const t = document.getElementById("toast");

  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.display = "none"; }, 2600);

/* ---------- warnings (1 / 2 / 3, auto from plate history) ---------- */
let ntWarn = 0; // 0 = auto
function platePriorCount(plate){
  const pp = String(plate || "").trim().toUpperCase(); if(!pp) return 0;
  return S.tickets.filter(t=>t.status !== "Void" && String(t.plate || "").toUpperCase() === pp).length;
}
function warnWord(n){ n = n || 1; return n === 1 ? "1st Warning" : n === 2 ? "2nd Warning" : n === 3 ? "3rd Warning" : n + "th Warning"; }
function warnChip(t){
  if(!t.warn) return "";
  const c = t.warn >= 3 ? "background:#FEE2E2; color:#991B1B" : t.warn === 2 ? "background:#FFEDD5; color:#9A3412" : "background:#FEF3C7; color:#92400E";
  return '<span class="badge" style="' + c + '">\u26A0 ' + esc(warnWord(t.warn)) + '</span>';
}
window.setWarn = n=>{ ntWarn = n; warnRefresh(); };
window.warnRefresh = ()=>{
  const plateEl = document.getElementById("nt-plate"); if(!plateEl) return;
  const auto = platePriorCount(plateEl.value) + 1;
  const eff = ntWarn > 0 ? ntWarn : auto;
  [1,2,3].forEach(n=>{ const b = document.getElementById("nt-warn" + n); if(b) b.classList.toggle("on", eff === n || (n === 3 && eff > 3)); });
  const lbl = document.getElementById("nt-warnlabel");
  if(lbl) lbl.textContent = "This ticket: " + warnWord(eff) + (ntWarn > 0 ? " (your pick)" : " \u2014 auto") + (auto > 1 ? " \u00B7 this plate already has " + (auto - 1) + " ticket" + (auto > 2 ? "s" : "") : "");
};

window.ticketPhotoPicked = input=>{
  const f = input.files && input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ processTicketPhoto(String(rd.result||"")); };
  rd.onerror = ()=>{ toast("Couldn't read that photo"); };
  try{ rd.readAsDataURL(f); }catch(e){ toast("Couldn't read that photo"); }
};
function processTicketPhoto(dataUrl){
  let settled = false;
  const finish = out=>{ if(settled) return; settled = true; setPendingPhoto(out); runPlateOCR(out); aiIdentifyCar(out); };
  try{
    const img = new Image();
    img.onload = ()=>{
      let out = dataUrl;
      try{
        const max = 1280;
        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(w && h && Math.max(w,h) > max){
          const sc = max / Math.max(w,h);
          const cv = document.createElement("canvas");
          cv.width = Math.round(w*sc); cv.height = Math.round(h*sc);
          const cx = cv.getContext("2d");
          if(cx){ cx.drawImage(img,0,0,cv.width,cv.height); out = cv.toDataURL("image/jpeg", 0.82); }
        }
      }catch(e){}
      finish(out);
    };
    img.onerror = ()=>finish(dataUrl);
    img.src = dataUrl;
    setTimeout(()=>finish(dataUrl), 2500); /* if the browser never fires load/error, keep the photo as-is */
  }catch(e){ finish(dataUrl); }
}
/* ----- AI car identification (photo -> plate + make + model + color via the locked cloud function) ----- */
function aiIdentifyCar(dataUrl){
  const setM = m=>{ const s = document.getElementById("nt-ocr"); if(s) s.textContent = m; };
  setM("Identifying the car\u2026");
  fetch(SB_URL + "/functions/v1/car-identify", { method: "POST", headers: { "Content-Type": "application/json", "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }, body: JSON.stringify({ image: dataUrl }) })
    .then(r => r.ok ? r.json() : Promise.reject(new Error("fn")))
    .then(j => {
      if(!j || j.error) return;
      let got = [];
      const plateEl = document.getElementById("nt-plate");
      if(j.plate && plateEl && !plateEl.value.trim()){ plateEl.value = String(j.plate).toUpperCase().replace(/\s+/g, ""); got.push("plate " + plateEl.value); if(window.warnRefresh) warnRefresh(); }
      const mk = document.getElementById("nt-make");
      if(j.make && mk && !mk.value){ const want = String(j.make).toLowerCase(); for(const o of mk.options){ if(o.value && o.value.toLowerCase() === want){ mk.value = o.value; got.push(o.value); if(window.rebuildModelOptions) rebuildModelOptions(); break; } } }
      if(j.model && !getModelValue() && setModelField(String(j.model))){ got.push(String(j.model)); }
      const cl = document.getElementById("nt-color");
      if(j.color && cl && !cl.value){ const want = String(j.color).toLowerCase(); for(const o of cl.options){ if(o.value && (o.value.toLowerCase() === want || want.indexOf(o.value.toLowerCase()) >= 0 || o.value.toLowerCase().indexOf(want) >= 0)){ cl.value = o.value; got.push(o.value); break; } } }
      if(got.length){ setM("Car identified: " + got.join(" \u00B7 ") + " \u2014 check it, then pick the violation."); toast("Car identified \u2014 check the fields"); }
    })
    .catch(()=>{});
}

/* ----- plate OCR (same Tesseract.js pattern as the Package app's label scan) ----- */
function loadTesseract(cb){
  if(window.Tesseract) return cb(null);
  const cdns=[
    "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"
  ];
  let i=0;
  const next=()=>{
    if(i>=cdns.length) return cb(new Error("ocr-unavailable"));
    const sc=document.createElement("script");
    sc.src=cdns[i++];
    sc.onload=()=>cb(null);
    sc.onerror=()=>next();
    document.head.appendChild(sc);
  };
  next();
}
const MODEL_WORDS = ["F-150","F150","SILVERADO","CAMRY","ACCORD","CIVIC","COROLLA","ALTIMA","SENTRA","WRANGLER","TAHOE","SUBURBAN","EXPLORER","ESCAPE","RAV4","HIGHLANDER","PILOT","CR-V","CRV","ROGUE","EQUINOX","TRAVERSE","SIERRA","RAM 1500","CHARGER","CHALLENGER","DURANGO","GRAND CHEROKEE","COMPASS","ELANTRA","SONATA","FORTE","OPTIMA","SORENTO","TUCSON","SANTA FE","MODEL 3","MODEL Y","MODEL S","MODEL X","JETTA","PASSAT","ATLAS","TIGUAN","CX-5","CX-9","CX-30","CX-50","CX-90","MAZDA3","MAZDA6","4RUNNER","TACOMA","TUNDRA","FRONTIER","TITAN","PATHFINDER","MURANO","ODYSSEY","RIDGELINE","TRAILBLAZER","BLAZER","COLORADO","CANYON","BRONCO","EXPEDITION","NAVIGATOR","ESCALADE","YUKON","ACADIA","ENCLAVE","XT5","GLE","GLC","X3","X5","Q5","Q7","A4","A6"];
function extractVehicle(text){
  const up = " " + String(text || "").toUpperCase().replace(/[^A-Z0-9\-]+/g, " ") + " ";
  let make = "";
  if(window.MAKES) for(const m of MAKES){ if(up.indexOf(" " + m.toUpperCase() + " ") >= 0){ make = m; break; } }
  if(!make){
    if(/F-?150|BRONCO|EXPLORER|ESCAPE|EXPEDITION/.test(up)) make = "Ford";
    else if(/SILVERADO|TAHOE|SUBURBAN|EQUINOX|TRAVERSE|TRAILBLAZER|BLAZER|COLORADO/.test(up)) make = "Chevrolet";
    else if(/SIERRA|CANYON|YUKON|ACADIA/.test(up)) make = "GMC";
    else if(/CAMRY|COROLLA|RAV4|HIGHLANDER|4RUNNER|TACOMA|TUNDRA/.test(up)) make = "Toyota";
    else if(/ACCORD|CIVIC|CR-?V|PILOT|ODYSSEY|RIDGELINE/.test(up)) make = "Honda";
    else if(/ALTIMA|SENTRA|ROGUE|FRONTIER|PATHFINDER|MURANO|TITAN/.test(up)) make = "Nissan";
    else if(/WRANGLER|GRAND CHEROKEE|COMPASS|CHEROKEE/.test(up)) make = "Jeep";
    else if(/CHARGER|CHALLENGER|DURANGO/.test(up)) make = "Dodge";
    else if(/RAM/.test(up)) make = "Ram";
    else if(/ELANTRA|SONATA|TUCSON|SANTA FE/.test(up)) make = "Hyundai";
    else if(/FORTE|OPTIMA|SORENTO|K5/.test(up)) make = "Kia";
    else if(/MODEL [3YSX]/.test(up)) make = "Tesla";
    else if(/JETTA|PASSAT|ATLAS|TIGUAN/.test(up)) make = "Volkswagen";
    else if(/CX-5|CX-9|CX-30|CX-50|CX-90|MAZDA3|MAZDA6|MIATA/.test(up)) make = "Mazda";
    else if(/ESCALADE|XT5/.test(up)) make = "Cadillac";
    else if(/NAVIGATOR/.test(up)) make = "Lincoln";
  }
  let model = "";
  for(const w of MODEL_WORDS){ if(up.indexOf(" " + w + " ") >= 0){ model = w; break; } }
  return { make: make, model: model };
}
function fillVehicleFromText(text){
  try{
    const v = extractVehicle(text);
    let filled = [];
    const mk = document.getElementById("nt-make");
    if(v.make && mk && !mk.value){ mk.value = v.make; filled.push(v.make); if(window.rebuildModelOptions) rebuildModelOptions(); }
    if(v.model && setModelField(v.model)){ filled.push(v.model); }
    return filled;
  }catch(e){ return []; }
}
function extractPlate(text){
  const U = String(text||"").toUpperCase();
  const raw = U.match(/[A-Z0-9]+(?:[ -][A-Z0-9]+)?/g) || [];
  let best = "";
  raw.forEach(tok=>{
    const core = tok.replace(/[ -]/g,"");
    if(core.length>=5 && core.length<=8 && /[A-Z]/.test(core) && /[0-9]/.test(core)){
      if(core.length > best.length) best = core;
    }
  });
  return best;
}
function runPlateOCR(dataUrl){
  const st = document.getElementById("nt-ocr");
  const setM = m=>{ if(st) st.textContent = m; };
  setM("Reading plate\u2026");
  loadTesseract(err=>{
    if(err || !window.Tesseract){ setM("Photo attached. Couldn't start the plate reader \u2014 type the plate in."); return; }
    try{
      Tesseract.recognize(dataUrl,"eng",{logger:m=>{ if(m && m.status==="recognizing text") setM("Reading plate\u2026 "+Math.round((m.progress||0)*100)+"%"); }})
      .then(r=>{
        const ocrText = (r && r.data && r.data.text) || "";
        const plate = extractPlate(ocrText);
        const vehFilled = fillVehicleFromText(ocrText);
        const field = document.getElementById("nt-plate");
        if(plate){
          if(field && !field.value.trim()){
            field.value = plate; if(window.warnRefresh) warnRefresh();
            setM("Plate read from photo \u2014 check it before saving.");
            toast("Plate read from photo \u2014 check it");
          } else {
            setM("Photo attached. Plate reader saw "+plate+" \u2014 the field already has a plate, so it was left as-is.");
          }
        } else {
          setM("Photo attached. Couldn't read a plate from it \u2014 type the plate in.");
        }
      })
      .catch(()=>{ setM("Photo attached. Plate reading failed \u2014 type the plate in."); });
    }catch(e){ setM("Photo attached. Plate reading failed \u2014 type the plate in."); }
  });
}

      + '<label>4-digit PIN</label><input type="text" id="tm-pin" inputmode="numeric" maxlength="4" placeholder="e.g. 2468">'
      + '<button class="btn btn-primary" onclick="addTeam()">Add team member</button>';
  }
  h += '<button class="btn btn-ghost" onclick="logout()">Log out'+(S.session&&S.session.name?' ('+esc(S.session.name)+')':'')+'</button></div>';
  h += '<div class="card"><h3>Login history</h3><p class="note">Every login, newest first.</p>';
  const _lg = (S.logins||[]).slice().reverse().slice(0,25);
  h += _lg.length ? _lg.map(e=>'<div class="kv"><span>'+esc(e.name)+'</span><b>'+fmtDT(e.t)+'</b></div>').join("") : '<div class="empty">No logins yet.</div>';
  h += '</div>';
  h += '<div class="card"><h3>Backup &amp; restore</h3><p class="note">Keep a copy of everything \u2014 the backup holds all tickets, team logins and settings. Import <b>replaces</b> everything here; Merge <b>combines</b> tickets from another copy (use it when moving data to a fresh link).</p>'
    + '<button class="btn btn-ghost" onclick="exportBackup()">Export backup (JSON)</button>'
    + '<button class="btn btn-ghost" onclick="document.getElementById(\'impjson\').click()">Import backup (JSON)</button>'
    + '<input type="file" id="impjson" accept=".json,application/json" style="display:none" onchange="importBackup(this)">'
    + '<button class="btn btn-ghost" onclick="document.getElementById(\'merjson\').click()">Merge backup (JSON)</button>'
    + '<input type="file" id="merjson" accept=".json,application/json" style="display:none" onchange="mergeBackup(this)"></div>';
  h += '<div class="card"><h3>Data</h3>'
    + '<p class="note">Records save on this device automatically and sync live with the team.'+(memOnly?' <b>Note:</b> this browser is blocking local saves \u2014 exports still work.':'')+'</p>'
    + '<button class="btn btn-ghost" onclick="printTicketList()">Print ticket list</button>'
    + '<button class="btn btn-danger" onclick="resetAll()">Delete ALL data</button></div>';
  h += '<div class="card"><h3>About</h3><p class="note">Loews Parking Tickets \u2014 digital parking violation tickets for the Lakewood Regional Office (LKWD), issued by Loews Hotels Security.<br><br>Power by: NDL systems tech</p></div>';
  document.getElementById("tab-more").innerHTML = h;
}
function dl(name, text, mime){
  const b = new Blob([text],{type:mime||"text/plain"}); const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
window.exportBackup = ()=>{
  dl("parking-tickets-backup-"+todayISO()+".json", JSON.stringify(S), "application/json");
  toast("Backup downloaded");
};
window.importBackup = inp=>{
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
    const d = JSON.parse(r.result);
    if(!d || !Array.isArray(d.tickets)){ alert("That file doesn't look like a parking-tickets backup."); return; }
    if(!confirm("Replace ALL current data with this backup?")) return;
    if(!Array.isArray(d.team)||!d.team.length) d.team = DEFAULT_TEAM.slice();
    if(!Array.isArray(d.logins)) d.logins = [];
    if(!d.seq) d.seq = 1;
    if(!d.seqDay) d.seqDay = "";
    S = d; save(); render(); toast("Backup restored");
  }catch(e){ alert("Could not read backup: "+e.message); } inp.value=""; };
  r.readAsText(f);
};
window.mergeBackup = inp=>{
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
    const d = JSON.parse(r.result);
    if(!d || !Array.isArray(d.tickets)){ alert("That file doesn't look like a parking-tickets backup."); return; }
    const lastAct = t=>{
      let m = String(t.created||"");
      (t.hist||[]).forEach(e=>{ const x = String(e.t||""); if(x>m) m = x; });
      return m;
    };
    let added = 0, updated = 0;
    (d.tickets||[]).forEach(bt=>{
      const ex = S.tickets.find(t=>t.uid===bt.uid);
      if(!ex){ S.tickets.push(bt); added++; return; }
      const newer = lastAct(bt) >= lastAct(ex) ? bt : ex;
      const older = newer===bt ? ex : bt;
      const seen = {}, mh = [];
      (newer.hist||[]).concat(older.hist||[]).forEach(e=>{
        const k = String(e.t||"")+"|"+String(e.e||"")+"|"+String(e.by||"");
        if(!seen[k]){ seen[k]=1; mh.push(e); }
      });
      S.tickets[S.tickets.indexOf(ex)] = Object.assign({}, older, newer, {hist:mh, uid:ex.uid});
      updated++;
    });
    const lseen = {}; (S.logins||[]).forEach(e=>{ lseen[e.name+"|"+e.t]=1; });
    (d.logins||[]).forEach(e=>{ const k = e.name+"|"+e.t; if(!lseen[k]){ lseen[k]=1; S.logins.push(e); } });
    const tseen = {}; (S.team||[]).forEach(m=>{ tseen[String(m.name||"").toLowerCase()]=1; });
    (d.team||[]).forEach(m=>{ const k = String(m.name||"").toLowerCase(); if(k && !tseen[k]){ tseen[k]=1; S.team.push(m); } });
    if(d.seqDay && d.seqDay > (S.seqDay||"")){ S.seqDay = d.seqDay; S.seq = d.seq || S.seq; }
    else if(d.seqDay === S.seqDay && (d.seq||0) > (S.seq||0)) S.seq = d.seq;
    save(); render();
    toast("Merged: "+added+" added, "+updated+" updated");
  }catch(e){ alert("Could not read backup: "+e.message); } inp.value=""; };
  r.readAsText(f);
};
window.resetAll = ()=>{
  if(!confirm("Delete ALL parking tickets on this device?")) return;
  S = {tickets:[], seq:1, seqDay:"", team:DEFAULT_TEAM.slice(), session:S.session, logins:S.logins||[]};
  save(); render(); toast("All data deleted");
};

/* ---------- team login ---------- */
function renderLoginUsers(){
  document.getElementById("login-user").innerHTML = S.team.map(t=>'<option>'+esc(t.name)+'</option>').join("");
}
function gateLogin(){
  const lg = document.getElementById("login");
  if(S.session && S.session.name){ lg.style.display = "none"; }
  else{ document.getElementById("login-pin").value = ""; document.getElementById("login-err").textContent = "";
    renderLoginUsers(); lg.style.display = "flex"; }
}
window.doLogin = ()=>{
  const name = document.getElementById("login-user").value;
  const pin = document.getElementById("login-pin").value.trim();
  if(!S.team.some(t=>t.name===name && t.pin===pin)){
    document.getElementById("login-err").textContent = "Wrong PIN \u2014 try again."; return; }
  S.session = {name:name};
  S.logins = S.logins||[]; S.logins.push({name:name, t:nowLocal()});
  if(S.logins.length>200) S.logins = S.logins.slice(-200);
  save();
  document.getElementById("login").style.display = "none";
  render(); toast("Welcome, "+name);
};
window.logout = ()=>{ S.session = null; save(); gateLogin(); };
window.addTeam = ()=>{
  if(!canAdmin()){ toast("Only Jeremy or Justin can add team members"); return; }
  const name = document.getElementById("tm-name").value.trim();
  const pin = document.getElementById("tm-pin").value.trim();
  if(!name){ toast("Enter a name"); return; }
  if(!/^\d{4}$/.test(pin)){ toast("PIN must be 4 digits"); return; }
  if(S.team.some(t=>t.name.toLowerCase()===name.toLowerCase())){ toast("That name is already added"); return; }
  S.team.push({name:name, pin:pin}); save(); render(); toast(name+" added");
};
window.delTeam = i=>{
  if(!canAdmin()){ toast("Only Jeremy or Justin can remove team members"); return; }
  const t = S.team[i]; if(!t) return;
  if(S.session && S.session.name===t.name){ toast("Can't remove the logged-in user"); return; }
  S.team.splice(i,1); save(); render(); toast(t.name+" removed");
};

function downloadReport(filename, html){
  try{
    const blob = new Blob([html],{type:"text/html"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 5000);
    return true;
  }catch(e){ return false; }
}
function prTable(heads, rows){
  let h = '<table class="pr-table"><thead><tr>';
  heads.forEach(x=>{ h += '<th>'+esc(x)+'</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>'; r.forEach(c=>{ h += '<td>'+c+'</td>'; }); h += '</tr>'; });
  return h + '</tbody></table>';
}

load();
if(!S.team || !S.team.length) S.team = DEFAULT_TEAM.slice();
/* Portal SSO: one login for the whole suite */
try{

      sessionStorage.setItem('pkr2',m[1]);
      location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
    }
  }).catch(function(){});
}
